name: CI

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # -------------------------
      # Python setup
      # -------------------------
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # -------------------------
      # Java setup
      # -------------------------
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # -------------------------
      # Generate shared enums
      # -------------------------
      - name: Generate enums
        run: |
          python shared/scripts/generate-enums.py

      # -------------------------
      # Verify generated code committed
      # -------------------------
      - name: Check generated files
        run: |
          git diff --exit-code

      # -------------------------
      # Python tests
      # -------------------------
      - name: Run Python tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest

      # # -------------------------
      # # Spring Boot build
      # # -------------------------
      # - name: Build local-eoc-service
      #   run: |
      #     cd services/local-eoc-service
      #     ./mvnw test

      # - name: Build cloud-processing-service
      #   run: |
      #     cd services/cloud-processing-service
      #     ./mvnw test

      # -------------------------
      # Validate Docker Compose
      # -------------------------
      - name: Validate Docker Compose
        run: |
          docker compose -f docker-compose.yml config