name: CI

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # -------------------------
      # Java setup
      # -------------------------
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # -------------------------
      # Build and test all services
      # -------------------------
      - name: Build national_eoc
        run: mvn -f national_eoc/pom.xml clean verify

      - name: Build local_eoc
        run: mvn -f local_eoc/pom.xml clean verify

      - name: Build sensor_simulating_service
        run: mvn -f sensor_simulating_service/pom.xml clean verify

      # -------------------------
      # Validate Docker Compose
      # -------------------------
      - name: Validate Docker Compose
        run: |
          docker compose -f compose.yaml config