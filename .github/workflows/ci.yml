name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  # -------------------------------------------------------
  # Build each Spring Boot module in parallel
  # Tests are skipped: integration tests require a live
  # Redpanda broker (localhost:19092). Add a service
  # container here when proper @SpringBootTest tests exist.
  # -------------------------------------------------------
  build:
    name: Build ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [local_eoc, national_eoc, sensor_simulating_service]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build ${{ matrix.module }}
        run: mvn -f ${{ matrix.module }}/pom.xml -q -DskipTests clean package

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.module }}-jar
          path: ${{ matrix.module }}/target/*.jar
          retention-days: 7

  # -------------------------------------------------------
  # Validate the Redpanda / Docker Compose file
  # -------------------------------------------------------
  validate-compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate compose.yaml
        run: docker compose -f compose.yaml config
