<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body, #map { width:100%; height:100vh; background-color:#060e18; }

  .leaflet-div-icon { background:transparent !important; border:none !important; }
  .leaflet-bar a {
    background-color:#0d2235 !important;
    color:#56b6c2 !important;
    border-color:#1a3a52 !important;
  }
  .leaflet-bar a:hover { background-color:#162d40 !important; }
  .leaflet-control-attribution { display:none; }

  .leaflet-tooltip {
    background: #0a1e30 !important;
    border: 1px solid #1a3a52 !important;
    color: #7ab8cc !important;
    font-family: monospace !important;
    font-size: 11px !important;
    box-shadow: none !important;
    padding: 3px 7px !important;
  }
  .leaflet-tooltip::before,
  .leaflet-tooltip-top::before,
  .leaflet-tooltip-bottom::before,
  .leaflet-tooltip-left::before,
  .leaflet-tooltip-right::before {
    display: none !important;
    border: none !important;
    content: none !important;
  }
</style>
</head>
<body>
<div id="map"></div>
<script>
var map = L.map('map', {
  center: [16.0, 107.5],
  zoom: 6,
  zoomControl: true,
  attributionControl: false,
  preferCanvas: true
});

map.getContainer().style.backgroundColor = '#060e18';

// Single tile layer (dark_all includes both base and city labels) — avoids
// the shadowPane rendering bug that produced the dark rectangle in JavaFX WebView
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  subdomains: 'abcd',
  maxZoom: 19
}).addTo(map);

var markers    = {};
var allLatLngs = [];
var fitTimer   = null;
var statusColors = {
  OK: '#00cc66', WARNING: '#e5a840', ERROR: '#e06c75', OFFLINE: '#444c5a'
};

function addSensorNode(id, nameVn, lat, lng, typeColor, status) {
  var color  = statusColors[status] || typeColor;
  var latLng = [lat, lng];
  allLatLngs.push(latLng);

  var circle = L.circleMarker(latLng, {
    radius:      id === 'HN' ? 9 : 7,
    fillColor:   color,
    color:       '#04080f',
    weight:      2,
    opacity:     1,
    fillOpacity: 1
  }).addTo(map);

  circle.bindTooltip(nameVn || id, {
    direction: 'top',
    offset:    [0, -8],
    permanent: false
  });

  markers[id] = { circle: circle };

  // Debounce: fit to all nodes once, 600 ms after the last node is added
  if (fitTimer) clearTimeout(fitTimer);
  fitTimer = setTimeout(function() {
    map.fitBounds(allLatLngs, { padding: [30, 30], maxZoom: 6 });
  }, 600);
}

function updateNodeStatus(id, status) {
  if (!markers[id]) return;
  markers[id].circle.setStyle({ fillColor: statusColors[status] || '#56b6c2' });
}
</script>
</body>
</html>
