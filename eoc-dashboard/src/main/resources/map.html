<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body, #map { width:100%; height:100vh; }
  html, body {
    background-color: #060e18 !important;
  }
  /* Remove ALL Leaflet default white boxes */
  .leaflet-div-icon { background:transparent !important; border:none !important; }

  /* Zoom buttons */
  .leaflet-bar a { background-color:#0d2235 !important; color:#56b6c2 !important; border-color:#1a3a52 !important; }
  .leaflet-bar a:hover { background-color:#162d40 !important; }
  .leaflet-control-attribution { display:none; }

  /* Tooltip — fully dark, no white arrow */
  .eoc-tooltip {
    background: #0a1e30 !important;
    border: 1px solid #1a3a52 !important;
    border-radius: 4px !important;
    color: #7ab8cc !important;
    font-family: 'Courier New', monospace !important;
    font-size: 11px !important;
    padding: 6px 10px !important;
    box-shadow: 0 2px 8px rgba(0,0,0,0.6) !important;
    white-space: nowrap;
  }
  /* Kill the white arrow on all tooltip directions */
  .eoc-tooltip::before,
  .leaflet-tooltip-left::before,
  .leaflet-tooltip-right::before,
  .leaflet-tooltip-top::before,
  .leaflet-tooltip-bottom::before {
    display: none !important;
    border: none !important;
  }
  .leaflet-tooltip {
    background: #0a1e30 !important;
    border: 1px solid #1a3a52 !important;
    color: #7ab8cc !important;
    font-family: monospace !important;
    font-size: 11px !important;
    box-shadow: none !important;
    padding: 3px 7px !important;
  }
  .leaflet-tooltip::before,
  .leaflet-tooltip-right::before,
  .leaflet-tooltip-left::before,
  .leaflet-tooltip-top::before,
  .leaflet-tooltip-bottom::before {
      display: none !important;
      border: none !important;
      content: none !important;
}
</style>
</head>
<body>
<div id="map"></div>
<script>
var map = L.map('map', {
  center: [16.0, 107.5],
  zoom: 6,
  zoomControl: true,
  attributionControl: false,
  preferCanvas: true
});

map.getContainer().style.backgroundColor = '#060e18';
// Dark tile layer
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png', {
  subdomains: 'abcd', maxZoom: 19
}).addTo(map);

// City labels on top
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_only_labels/{z}/{x}/{y}{r}.png', {
  subdomains: 'abcd', maxZoom: 19, pane: 'shadowPane'
}).addTo(map);

// ── Markers ───────────────────────────────────────────────
var markers = {};
var statusColors = {
  OK: '#00cc66', WARNING: '#e5a840', ERROR: '#e06c75', OFFLINE: '#444c5a'
};

function addSensorNode(id, nameVn, lat, lng, typeColor, status) {
  var color = statusColors[status] || typeColor;

  // Dot
  var circle = L.circleMarker([lat, lng], {
    radius:      id === 'HN' ? 9 : 7,
    fillColor:   color,
    color:       '#04080f',
    weight:      2,
    opacity:     1,
    fillOpacity: 1
  }).addTo(map);

  markers[id] = { circle: circle };
}

function updateNodeStatus(id, status) {
  if (!markers[id]) return;
  markers[id].circle.setStyle({ fillColor: statusColors[status] || '#56b6c2' });
}
</script>
</body>
</html>
